name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: 单元（纯逻辑）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 无 npm install：项目零依赖，测试用 Node 内置 runner
      # glob 落空时 node 会「0 个测试、exit 0」静默放行 —— 先钉死文件存在
      - run: ls test/*.test.js
      - run: node --test test/*.test.js 2>&1 | tee /tmp/unit.log
      - name: 断言真的跑了测试（防 glob 落空静默绿）
        run: grep -qE '[[:space:]]tests[[:space:]]+[1-9]' /tmp/unit.log

  browser:
    name: 浏览器（DOM 单元 + 端到端冒烟）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
      - run: chmod +x test/*.sh
      - run: ./test/run-browser.sh
        env:
          CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
