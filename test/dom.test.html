<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>menxia DOM tests</title></head>
<body>
<!-- DOM 层测试：跑在真 Chrome 里（不引 jsdom）。测的是渲染行号规则与锚定几何——
     M2 锚定的全部精度都建立在这两块上，改渲染器最容易在这里悄悄坏掉。
     由 test/run-dom.sh 以 headless 方式执行，结果打印成 [dom] 行、失败非零退出。 -->
<div id="stage"></div>
<script src="../vendor/markdown-it.min.js"></script>
<script type="module">
import { renderMarkdown } from '../src/render.js';
import { computeAnchor, rangeForDraft, rangeFromTextOffset, sectionOf, reanchorByQuote } from '../src/anchor.js';
import { figureFor } from '../src/mermaid.js';

let pass = 0, fail = 0;
const eq = (name, got, want) => {
  const ok = JSON.stringify(got) === JSON.stringify(want);
  ok ? pass++ : fail++;
  console.log(`[dom] ${ok ? 'PASS' : 'FAIL'} ${name}${ok ? '' : ` — got ${JSON.stringify(got)} want ${JSON.stringify(want)}`}`);
};
const ok_ = (name, cond, detail = '') => eq(name, Boolean(cond) ? true : `false ${detail}`, true);

const stage = document.getElementById('stage');
const MD = [
  '# 标题一',                       // 1
  '',                               // 2
  '第一段正文，含**加粗**与`代码`。', // 3
  '',                               // 4
  '## 标题二',                       // 5
  '',                               // 6
  '| a | b |',                      // 7
  '|---|---|',                      // 8
  '| 行一 | x |',                   // 9
  '| 行二 | y |',                   // 10
  '',                               // 11
  '```js',                          // 12
  'const a = 1;',                   // 13
  'const b = 2;',                   // 14
  'const c = 3;',                   // 15
  '```',                            // 16
  '',                               // 17
  '- 列表项甲',                      // 18
  '- 列表项乙',                      // 19
  '',                               // 20
  '隔开列表的一段话。',              // 21 ← 必须隔开：列表后紧跟的 4 空格缩进块
  '',                               // 22   会被 CommonMark 吸进列表当续段，不成代码块
  '    缩进代码行一',                // 23
  '    缩进代码行二',                // 24
  '',                               // 25
  '```diff',                        // 26
  '@@ -1,2 +1,2 @@',                // 27
  '-旧的一行',                       // 28
  '+新的一行',                       // 29
  '```',                            // 30
].join('\n');

stage.innerHTML = renderMarkdown(MD);

// ── 1. 渲染器行号规则（锚定的地基）──
const line = (sel) => { const el = stage.querySelector(sel); return el ? +el.dataset.line : null; };
eq('h1 行号', line('h1'), 1);
eq('段落行号', line('p'), 3);
eq('h2 行号', line('h2'), 5);
eq('table 行号', line('table'), 7);
eq('表格 tr 有独立行号（缺它则批表格只能锚到整表首行）', line('tbody tr'), 9);
eq('第二个表格行独立成行', +stage.querySelectorAll('tbody tr')[1].dataset.line, 10);
eq('fence 行号落在 <code> 上且指向 ``` 行', line('pre > code[data-line]'), 12);
eq('缩进代码块行号落在 <pre> 上且是首行', line('pre[data-line]'), 23);
eq('列表项行号', line('li'), 18);
ok_('块级元素带 data-line-end', stage.querySelector('h1').dataset.lineEnd === '1');

// ── 2. 选区 → 锚（computeAnchor 的行号数学）──
function selectText(root, text) {
  for (const block of root.querySelectorAll('[data-line]')) {
    const idx = block.textContent.indexOf(text);
    if (idx < 0) continue;
    const r = rangeFromTextOffset(block, idx, text.length);
    if (!r) continue;
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    return r;
  }
  return null;
}

selectText(stage, '第一段正文');
eq('段落内划选 → 段落行号', computeAnchor(stage)?.line, 3);

selectText(stage, 'const b = 2;');
eq('fence 内第二行代码 → 精确到该行（fence 首行 +1 +换行数）', computeAnchor(stage)?.line, 14);

selectText(stage, 'const a = 1;');
eq('fence 内第一行代码', computeAnchor(stage)?.line, 13);

selectText(stage, '缩进代码行二');
eq('缩进代码块第二行 → 精确到该行（+0 偏移）', computeAnchor(stage)?.line, 24);

selectText(stage, '行二');
eq('表格第二行划选 → 该行行号', computeAnchor(stage)?.line, 10);

// ```diff 围栏的 data-line 在 <pre class="diff-block"> 上（不是 <code>），但它仍指向 ``` 行，
// 必须与普通围栏一样 +1——曾按标签判成「缩进代码块 +0」，diff 里的涂归全部呈到上一行（review #182 N0）。
eq('diff 围栏行号落在 pre.diff-block 上且指向 ``` 行', line('pre.diff-block[data-line]'), 26);
selectText(stage, '@@ -1,2');
eq('diff 围栏内第一行 → 与普通围栏同样 +1', computeAnchor(stage)?.line, 27);
selectText(stage, '+新的一行');
eq('diff 围栏内第三行 → 精确到该行', computeAnchor(stage)?.line, 29);

selectText(stage, '加粗');
const boldAnchor = computeAnchor(stage);
eq('划中内联格式内的字仍锚到源行（文本搜索会失败，DOM 主锚不会）', boldAnchor?.line, 3);
ok_('引文取渲染文本（不含 markdown 记号）', boldAnchor?.quote === '加粗');

getSelection().removeAllRanges();
eq('无选区 → 不产生锚', computeAnchor(stage), null);

// ── 3. 高亮定位与撞词偏移 ──
stage.innerHTML = renderMarkdown('句子甲。重复短语。句子乙。重复短语。句子丙。');
const block = stage.querySelector('p');
const full = block.textContent;
const firstIdx = full.indexOf('重复短语');
const secondIdx = full.indexOf('重复短语', firstIdx + 1);
const rFirst = rangeForDraft(stage, { blockLine: 1, quoteRaw: '重复短语', offset: firstIdx });
const rSecond = rangeForDraft(stage, { blockLine: 1, quoteRaw: '重复短语', offset: secondIdx });
ok_('撞词：按块内偏移定位到第二处而非永远第一处',
  rFirst && rSecond && rFirst.startOffset !== rSecond.startOffset,
  `first=${rFirst?.startOffset} second=${rSecond?.startOffset}`);
eq('引文不存在时返回 null（不乱画高亮）',
  rangeForDraft(stage, { blockLine: 1, quoteRaw: '根本没有这句', offset: 0 }), null);

// ── 3b. mermaid 渲图后的锚定（review M1）：figure 替掉 pre 后，源码留在折叠的 <details> 里 ──
// 修前 figure 只有 <img>：划不中源码、草稿高亮 / 按引文重锚都在空 textContent 里找不到。
stage.innerHTML = renderMarkdown(['段落', '', '```mermaid', 'graph TD', '  甲节点 --> 乙节点', '```'].join('\n'));
{
  const pre = stage.querySelector('pre');
  const src = pre.querySelector('code').textContent;
  pre.replaceWith(figureFor(pre, 'blob:x', 'mermaid', src, '图源码'));
  stage.querySelector('figure.mermaid-fig details').open = true;   // 展开才能真划选
  selectText(stage, '甲节点 --> 乙节点');
  const a = computeAnchor(stage);
  eq('mermaid figure 内划选源码第二行 → 精确到该行（与 fence 同样 +1）', a?.line, 5);
  ok_('mermaid figure：草稿高亮按引文在 figure 里定位得到', a && rangeForDraft(stage, a)?.toString() === '甲节点 --> 乙节点');
  eq('mermaid figure：过期评论按引文重锚回 fence 行', reanchorByQuote(stage, '甲节点 --> 乙节点'), 3);
  getSelection().removeAllRanges();
}

// ── 4. sectionOf：批注卡上的出处 ──
stage.innerHTML = renderMarkdown(MD);
eq('取该行之前最近的标题', sectionOf(stage, 9), '标题二');
eq('第一节之内取 h1', sectionOf(stage, 3), '标题一');

// ── 5. 标题 id：页内锚点 `[…](#slug)` 的落点 ──
// 钉的是「与 GitHub 口径相同」，不是「我们自己算得出一个 id」——同一份 markdown 两处都要能跳。
const HEAD_MD = [
  '# 标题一',
  '',
  '## 加长段（冒烟用，别删）',
  '',
  '## 带 [外链](https://example.com/x) 的标题',
  '',
  '## 小结',
  '',
  '## 小结',
  '',
  '## ![封面](https://example.com/cover.png)',
].join('\n');
stage.innerHTML = renderMarkdown(HEAD_MD, { headingIds: true });
const hIds = [...stage.querySelectorAll('h1[id],h2[id]')].map((h) => h.id);
eq('标题按 GitHub 口径打 id（CJK 标点全去掉）', hIds.slice(0, 2), ['标题一', '加长段冒烟用别删']);
eq('标题里的链接只取可见文字，不把 URL 算进 slug', hIds[2], '带-外链-的标题');
eq('同名标题去重（第二个追加 -1）', hIds.slice(3), ['小结', '小结-1']);
ok_('id 与 data-line 并存（涂归的锚不能被页内锚顶掉）',
  stage.querySelector('h1').dataset.line === '1' && stage.querySelector('h1').id === '标题一',
  `line=${stage.querySelector('h1').dataset.line} id=${stage.querySelector('h1').id}`);
// 图片独占的标题取不出可见文字 → 不打 id。**别退回 inline.content**，那是原始 markdown，
// 会把整条 URL 灌进 slug（`id="封面httpsexamplecomcoverpng"`）。
eq('图片独占的标题不打 id（不把 URL 灌进 slug）',
  [...stage.querySelectorAll('h2')].filter((h) => h.querySelector('img')).map((h) => h.id), ['']);
// 批注面共用同一个渲染器；跟着打 id 就会跨面重复（正文与判里各一个「## 小结」）
eq('不开 headingIds 时一个 id 都不打',
  renderMarkdown(HEAD_MD).includes('id='), false);

stage.innerHTML = renderMarkdown('见 [[#某节]]，以及 [[别篇#某节]]。');
const wHrefs = [...stage.querySelectorAll('a.wikilink')].map((a) => a.getAttribute('href'));
eq('双链只给锚＝本篇内跳转（不拼成 .md#…那种死链）', decodeURIComponent(wHrefs[0] ?? ''), '#某节');
// ⚠️ 名字里的「暂只切篇」不是啰嗦，是**防这条断言被读成「跨篇锚点可用」**：
// 点击路径在 `link.js` 的 `resolveRelativeDocLink` 里就 `h.split('#')[0]` 把片段切掉了，
// ui.js 拿到的只有文件名，`setDocPath` 换完篇落在顶部，`#某节` 静默蒸发。
// 本条只钉 href 字符串这一层。补法：rel 命中折内时把片段存进 jumpRef，docTick 就位后调 jumpToAnchor。
eq('双链带文件名时 href 仍是「文件 + 锚」（点击暂只切篇不落锚）',
  decodeURI(wHrefs[1] ?? ''), '别篇.md#某节');

// ── 展图（PAIN #55）──
// 委托而非逐图挂 handler，所以这里要钉的正是「委托选中了谁」：
// 绝对 URL 的图也要认（挂 hydrateRelativeImages 的方案只认相对路径，那是最初的错方案）；
// 岛屿 innerHTML 整个换掉之后仍然要认（岛屿是 uncontrolled 的，每次换篇都 replaceChildren）。
const { bindImageZoom } = await import('../src/components/image-view.js');
let zoomed = null;
const unbind = bindImageZoom(stage, (v) => { zoomed = v; });

stage.innerHTML = renderMarkdown('![全景架构](assets/wiki-overview.png)');
stage.querySelector('img').click();
eq('点正文图 → 开展图窗，带上 src 与 alt', [zoomed?.src?.endsWith('assets/wiki-overview.png'), zoomed?.alt],
  [true, '全景架构']);

zoomed = null;
stage.innerHTML = renderMarkdown('![远图](https://example.com/a.png)');
stage.querySelector('img').click();
ok_('绝对 URL 的图同样能点开（委托覆盖全部 img，不只相对路径那批）', zoomed !== null);

// 岛屿换过两轮 innerHTML 了，监听器仍在 —— 这是选委托而非逐图绑定的全部理由
zoomed = null;
stage.innerHTML = renderMarkdown('![换篇后](assets/x.png)');
stage.querySelector('img').click();
ok_('岛屿 innerHTML 换掉后仍认（委托扛得住 replaceChildren）', zoomed !== null);

// 包在链接里的图应当走链接，别劫持成展图 —— 否则外链图永远点不出去
zoomed = null;
stage.innerHTML = renderMarkdown('[![带链接的图](assets/y.png)](https://example.com)');
stage.querySelector('img').click();
ok_('图外面套着链接时不劫持（让位给链接本身）', zoomed === null);

unbind();
zoomed = null;
stage.innerHTML = renderMarkdown('![解绑后](assets/z.png)');
stage.querySelector('img').click();
ok_('解绑后不再触发（effect 清理是真的清掉了）', zoomed === null);

console.log(`[dom] RESULT pass=${pass} fail=${fail}`);
</script>
</body>
</html>
